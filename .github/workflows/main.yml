name: Pipeline CI/CD

on: 
  push: 
    branches: [main, feat/portfolio-v2]

jobs: 
  build:
    runs-on: windows
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node 
        uses: actions/setup-node@v3
        with: 
          node-version: 18

      - name: Install dependencies 
        run: npm install

      - name: Run tests
        run: npm run test
  deploy:
    needs: build
    runs-on: windows-latest
    
    steps:
      - name: Deploy (simulado)
        run: echo "Deploy realizado com sucesso"
